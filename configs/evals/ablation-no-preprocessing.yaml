# Full framework with only grammar preprocessing disabled.
# All other settings match ablation-00-full.yaml.
llm:
    temperature: 0.0
    reasoning_effort: "medium"

agent:
    max_retries: 15
    enable_preprocessing: false
    enable_rfc_retrieval_tool: true
    enable_negative_packets: true
    show_packet_representation: false
    show_parsing_tree: false
