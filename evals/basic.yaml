name: "Evaluation for the 5 simpler protocols"

note: "Compare Gemini vs Qwen vs GPT-5.4 on the 5 simplest binary protocols on both Spicy and 3D."

defaults:
  models:
    - "gemini-3.1-flash"
    - "gpt-oss"
    - "gpt-5.4"
  configs:
    - "configs/default.yaml"
  target_languages:
    - "spicy"
    - "3d"
  
  no_spec: false
  samples: 3

protocols:
  tftp:
    {}

  dhcp:
    {}

  udp:
    {}

  tcp:
    spec_file: "misc/specs/tcp-header-format.txt"

  ipv4:
    spec_file: "misc/specs/ipv4-header-format.txt"
