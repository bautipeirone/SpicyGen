# GPT-5.4 Spicy benchmark with stable specification paths.
#
# Unmarked entries use the same automatic summary as the reported benchmark.
# RERUN entries did not historically use an automatic summary (or, for DNS,
# the exact source could not be recovered). Entries marked RERUN-READY already
# point at a copied automatic summary. Entries marked RERUN-BLOCKED preserve
# the historical source until an automatic summary is generated; replace that
# source before running the standardized repair.

name: "Best Model Benchmark — Spicy"

note: >-
  GPT-5.4 Spicy benchmark using stable copies of the automatic specification
  summaries. RERUN comments identify results that must be regenerated for a
  uniformly automatic-summary benchmark.

defaults:
  models:
    - "gpt-5.4"
  configs:
    - "configs/best-model-benchmark.yaml"
  target_languages:
    - "spicy"
  no_spec: false
  samples: 1

protocols:
  arp:
    spec_file: "../../data/outputs/benchmark-summaries/gpt-5.4/arp.txt"
