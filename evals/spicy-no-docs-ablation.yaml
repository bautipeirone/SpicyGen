# Spicy documentation ablation for direct comparison with models-comparison.yaml.
# Generation config, protocol specifications, target language, and sample
# count are identical; only the target-language instructions change. Spec
# summaries now live in ../../data/ (same files as the gpt-5.4 baseline runs).

name: "Spicy Documentation Ablation"

note: >-
  Repeat the LLM Models Evaluation without the conventional Spicy language
  documentation. NO_DOCS.md supplies only the language/version identity and
  official documentation URL.

defaults:
  models:
    - "gpt-5.4"
  configs:
    - "configs/models-comparison.yaml"
  target_languages:
    - "spicy"
  instructions_file: "prompts/spicy/NO_DOCS.md"
  no_spec: false
  samples: 1

protocols:
  # Binary ones, ranging from simple to complex.
  tftp:
    spec_file: "../../data/workspaces/tftp/gpt-5.4/20260727_153219/preprocess/summary.txt"

  dhcp: {}

  dns:
    spec_file: "../../data/outputs/summary/dns-gpt-5.4.txt"

  # Text ones, ranging from simple to complex.
  ident:
    spec_file: "../../data/workspaces/ident/gpt-5.4/20260724_164806/preprocess/summary.txt"

  telnet: {}

  http1.1:
    spec_file: "misc/specs/http1.1-grammar-and-headers.txt"
