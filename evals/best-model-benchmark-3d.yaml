  ntp:
    spec_file: "../../data/outputs/benchmark-summaries/gpt-5.4/ntp.txt"
  # Preserve the exact input of the historical 3D run; ospfv3.txt was revised later.
  ospfv3:
    spec_file: "../../data/outputs/benchmark-summaries/gpt-5.4/ospfv3-historical-3d.txt"
  ppp:
